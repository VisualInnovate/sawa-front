<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sawa_logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#135c65" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAWA</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // A page kept from before a deploy asks for files that are gone and stays blank: reload it once from the server.
      window.addEventListener("load", function () {
        setTimeout(function () {
          var app = document.getElementById("app");
          if (app && !app.hasChildNodes() && !sessionStorage.getItem("blank-reload")) {
            sessionStorage.setItem("blank-reload", "1");
            location.reload();
          } else if (app && app.hasChildNodes()) {
            sessionStorage.removeItem("blank-reload");
          }
        }, 4000);
      });
    </script>
    <script type="module" src="/src/main.js"></script>
    <!--    <script src="fullcalendar/lang-all.js"></script>-->
  </body>
</html>
